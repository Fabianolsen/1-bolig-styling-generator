<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Apex – AI Personal Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d0d0f;
    color: #e8e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* API KEY BAR */
  #api-bar {
    background: #16161a;
    border-bottom: 1px solid #2a2a35;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #api-bar label {
    font-size: 12px;
    color: #888;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #api-key-input {
    flex: 1;
    background: #0d0d0f;
    border: 1px solid #2a2a35;
    border-radius: 6px;
    color: #e8e8f0;
    padding: 7px 12px;
    font-size: 13px;
    font-family: monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  #api-key-input:focus { border-color: #ff4d00; }
  #api-key-status {
    font-size: 11px;
    color: #ff4d00;
    white-space: nowrap;
  }
  #api-key-status.ok { color: #00e676; }

  /* MAIN LAYOUT */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT PANEL – FIGURE */
  #figure-panel {
    width: 280px;
    flex-shrink: 0;
    background: linear-gradient(160deg, #16161a 0%, #0d0d0f 100%);
    border-right: 1px solid #2a2a35;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px 24px;
  }

  .trainer-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff4d00, #ff9a00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .trainer-sub {
    font-size: 12px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: -18px;
  }

  #trainer-svg {
    width: 180px;
    height: 260px;
  }

  .stats {
    display: flex;
    gap: 16px;
  }
  .stat {
    text-align: center;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 800;
    color: #ff4d00;
  }
  .stat-label {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* RIGHT PANEL – CHAT */
  #chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid #1e1e25;
    background: #121216;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00e676;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  #chat-header-title {
    font-size: 15px;
    font-weight: 700;
    color: #e8e8f0;
  }
  #chat-header-sub {
    font-size: 12px;
    color: #555;
    margin-left: auto;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: #2a2a35 transparent;
  }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }

  .message {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    animation: fadeUp 0.25s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.coach { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .message.user .bubble {
    background: linear-gradient(135deg, #ff4d00, #ff7a00);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .message.coach .bubble {
    background: #1e1e28;
    color: #dddde8;
    border-bottom-left-radius: 4px;
    border: 1px solid #2a2a38;
  }
  .meta {
    font-size: 11px;
    color: #444;
    margin-top: 4px;
    padding: 0 4px;
  }

  /* TYPING INDICATOR */
  .typing-bubble {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    background: #1e1e28;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    border: 1px solid #2a2a38;
    width: fit-content;
  }
  .typing-bubble span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff4d00;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* INPUT AREA */
  #input-area {
    padding: 16px 24px;
    border-top: 1px solid #1e1e25;
    background: #121216;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    background: #1e1e28;
    border: 1px solid #2a2a38;
    border-radius: 12px;
    color: #e8e8f0;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #user-input:focus { border-color: #ff4d00; }
  #user-input::placeholder { color: #444; }

  #send-btn {
    background: linear-gradient(135deg, #ff4d00, #ff7a00);
    border: none;
    border-radius: 10px;
    width: 46px;
    height: 46px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #send-btn svg { width: 20px; height: 20px; fill: white; }

  /* WELCOME MESSAGE */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: #444;
    font-size: 14px;
    line-height: 1.8;
  }
  .welcome strong { color: #ff4d00; }
</style>
</head>
<body>

<!-- API KEY BAR -->
<div id="api-bar">
  <label>Anthropic API-nøkkel</label>
  <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off">
  <span id="api-key-status">Ikke satt</span>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT: ANIMATED FIGURE -->
  <div id="figure-panel">
    <div class="trainer-name">Coach Apex</div>
    <div class="trainer-sub">AI Personal Trainer</div>

    <svg id="trainer-svg" viewBox="0 0 180 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#ff4d00"/>
          <stop offset="100%" style="stop-color:#ff9a00"/>
        </linearGradient>
        <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#e8b89a"/>
          <stop offset="100%" style="stop-color:#c8906a"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- GLOW RING -->
      <ellipse cx="90" cy="250" rx="50" ry="8" fill="#ff4d00" opacity="0.18"/>

      <!-- LEGS -->
      <rect x="74" y="175" width="16" height="55" rx="7" fill="#1a1a22"/>
      <rect x="92" y="175" width="16" height="55" rx="7" fill="#1a1a22"/>
      <!-- SHOES -->
      <rect x="68" y="225" width="26" height="10" rx="5" fill="#ff4d00"/>
      <rect x="88" y="225" width="26" height="10" rx="5" fill="#ff4d00"/>

      <!-- TORSO -->
      <rect x="63" y="105" width="54" height="75" rx="12" fill="url(#bodyGrad)" filter="url(#glow)"/>
      <!-- SHIRT DETAIL -->
      <path d="M90 110 L90 175" stroke="#ff2200" stroke-width="2" opacity="0.4"/>
      <text x="90" y="150" text-anchor="middle" font-size="11" font-weight="900"
            fill="white" opacity="0.7" letter-spacing="1">APEX</text>

      <!-- LEFT ARM (animated) -->
      <g id="arm-left" transform-origin="70 115">
        <rect x="42" y="108" width="30" height="13" rx="6" fill="url(#bodyGrad)"/>
        <!-- forearm -->
        <rect x="26" y="102" width="20" height="12" rx="5" fill="url(#skinGrad)"
              transform-origin="46 108"/>
        <!-- fist -->
        <circle cx="24" cy="107" r="8" fill="url(#skinGrad)"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-18;18;-18" dur="2.2s" repeatCount="indefinite"
          additive="sum"/>
      </g>

      <!-- RIGHT ARM (animated, opposite phase) -->
      <g id="arm-right" transform-origin="110 115">
        <rect x="108" y="108" width="30" height="13" rx="6" fill="url(#bodyGrad)"/>
        <rect x="134" y="102" width="20" height="12" rx="5" fill="url(#skinGrad)"
              transform-origin="134 108"/>
        <circle cx="156" cy="107" r="8" fill="url(#skinGrad)"/>
        <animateTransform attributeName="transform" type="rotate"
          values="18;-18;18" dur="2.2s" repeatCount="indefinite"
          additive="sum"/>
      </g>

      <!-- NECK -->
      <rect x="83" y="88" width="14" height="20" rx="5" fill="url(#skinGrad)"/>

      <!-- HEAD -->
      <ellipse cx="90" cy="76" rx="26" ry="28" fill="url(#skinGrad)"/>
      <!-- HAIR -->
      <ellipse cx="90" cy="52" rx="26" ry="14" fill="#1a1a1a"/>
      <rect x="64" y="52" width="52" height="10" rx="5" fill="#1a1a1a"/>
      <!-- EYES -->
      <ellipse cx="80" cy="74" rx="4" ry="4.5" fill="white"/>
      <ellipse cx="100" cy="74" rx="4" ry="4.5" fill="white"/>
      <circle cx="81" cy="75" r="2.5" fill="#1a1a1a"/>
      <circle cx="101" cy="75" r="2.5" fill="#1a1a1a"/>
      <!-- SMILE -->
      <path d="M80 86 Q90 94 100 86" stroke="#c87050" stroke-width="2.5"
            fill="none" stroke-linecap="round"/>
      <!-- EYEBROWS (determined look) -->
      <path d="M76 68 Q80 65 84 67" stroke="#1a1a1a" stroke-width="2.5"
            fill="none" stroke-linecap="round"/>
      <path d="M96 67 Q100 65 104 68" stroke="#1a1a1a" stroke-width="2.5"
            fill="none" stroke-linecap="round"/>

      <!-- HEADBAND -->
      <path d="M64 63 Q90 56 116 63" stroke="#ff4d00" stroke-width="5"
            fill="none" stroke-linecap="round" opacity="0.9"/>
    </svg>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="msg-count">0</div>
        <div class="stat-label">Meldinger</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="session-time">0m</div>
        <div class="stat-label">Økt</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: CHAT -->
  <div id="chat-panel">
    <div id="chat-header">
      <div class="pulse-dot"></div>
      <div class="chat-header-title">Coach Apex</div>
      <div id="chat-header-sub">Klar til å trene 💪</div>
    </div>

    <div id="messages">
      <div class="welcome">
        <strong>Velkommen til Coach Apex!</strong><br>
        Legg inn din Anthropic API-nøkkel øverst,<br>
        og start samtalen nedenfor.
      </div>
    </div>

    <div id="input-area">
      <textarea id="user-input" rows="1"
        placeholder="Spør om trening, kosthold, motivasjon..."></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById('api-key-input');
  const apiKeyStatus = document.getElementById('api-key-status');
  const messagesEl = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const msgCountEl = document.getElementById('msg-count');
  const sessionTimeEl = document.getElementById('session-time');

  let history = [];
  let msgCount = 0;
  let sessionStart = Date.now();

  // Session timer
  setInterval(() => {
    const mins = Math.floor((Date.now() - sessionStart) / 60000);
    sessionTimeEl.textContent = mins + 'm';
  }, 10000);

  // API key validation feedback
  apiKeyInput.addEventListener('input', () => {
    const val = apiKeyInput.value.trim();
    if (val.startsWith('sk-ant-') && val.length > 20) {
      apiKeyStatus.textContent = 'Klar ✓';
      apiKeyStatus.className = 'ok';
    } else if (val.length > 0) {
      apiKeyStatus.textContent = 'Ugyldig format';
      apiKeyStatus.className = '';
    } else {
      apiKeyStatus.textContent = 'Ikke satt';
      apiKeyStatus.className = '';
    }
  });

  // Auto-resize textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });

  // Send on Enter (Shift+Enter = newline)
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addMessage(role, text) {
    // Remove welcome if present
    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    const wrap = document.createElement('div');
    wrap.className = 'message ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const now = new Date();
    meta.textContent = now.getHours().toString().padStart(2,'0') + ':' +
                       now.getMinutes().toString().padStart(2,'0');

    wrap.appendChild(bubble);
    wrap.appendChild(meta);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (role === 'user' || role === 'coach') {
      msgCount++;
      msgCountEl.textContent = msgCount;
    }

    return bubble;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'message coach';
    wrap.id = 'typing-indicator';

    const typingBubble = document.createElement('div');
    typingBubble.className = 'typing-bubble';
    typingBubble.innerHTML = '<span></span><span></span><span></span>';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = 'Coach Apex skriver...';

    wrap.appendChild(typingBubble);
    wrap.appendChild(meta);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      apiKeyInput.focus();
      apiKeyStatus.textContent = 'Legg inn nøkkel først!';
      apiKeyStatus.className = '';
      return;
    }

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    showTyping();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5',
          max_tokens: 1024,
          system: 'Du er Coach Apex, en entusiastisk og motiverende AI personal trainer. Svar alltid på norsk med konkrete og praktiske treningsråd.',
          messages: history
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const reply = data.content[0].text;

      removeTyping();
      addMessage('coach', reply);
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      removeTyping();
      addMessage('coach', '⚠️ Feil: ' + err.message + '\n\nSjekk at API-nøkkelen er korrekt og har tilgang til Claude API.');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }
</script>
</body>
</html>
